
name: Node CI/CD Pipeline


env:
  AWS_REGION: eu-north-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::755610386021:role/your-github-actions-role

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:latest

  deploy-to-eks:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: docker-build-push

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # - name: Configure AWS Credentials
      #     uses: aws-actions/configure-aws-credentials@v4
      #     with:
      #       aws-region: eu-north-1        # Required — add this line
      #       role-to-assume: arn:aws:iam::755610386021:role/your-github-actions-role
            # OR use static credentials (less recommended):
            # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}


      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/app.yaml

      - name: Deploy new Docker image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:${{ github.sha }}
        run: |
          kubectl set image deployment/hello-node \
            hello-node="$IMAGE"

          kubectl rollout status deployment/hello-node \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services