

name: node CI Pipeline

on:
  push:
    branches: [working]
  workflow_dispatch:

jobs:
  buiild-test:
   steps: 
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '25'

    - name: Install dependencies
      working-directory: .\app1-hello\node
      run: npm ci

    - name: Run Test (If any)
      working-directory: .\app1-hello\node
      run: npm test --if-present
  
  docker-build-push:
     runs-on: ububntu-latest
     needs: build-test

  steps: 
     - name: Checkout code
       uses: actions/checkout@v7

     - name: Login to Docker Hub 
       working-directory: .\app1-hello\node
       uses: docker/login-action@v4
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}

     - name: Build and Push Docker Image
       uses: docker/build-push-action@v4
       with:
         context: .
         push: true
         tags: ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:latest